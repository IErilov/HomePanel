
server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Vue Router — поддержка прямого открытия страниц
    # и перезагрузки без ошибки 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статические ресурсы Vite
    location /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Не кешировать index.html, чтобы получать актуальную сборку
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
    }

    # Страница ошибки
    error_page 404 /index.html;
}
