services:
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: hp-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: cafe_database
      POSTGRES_USER: user_cafe
      PGPASSWORD: password_cafe
    volumes:
      - ../backups/database:/backups
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
      - home-panel