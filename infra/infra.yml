services:
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: hp-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: cafe_database
      POSTGRES_USER: user_cafe
      PGPASSWORD: password_cafe
    volumes:
      - ../backups/database:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ICW_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
      - home-panel
    networks:
      - backend

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: user_cafe
      POSTGRES_PASSWORD: password_cafe
      POSTGRES_DB: cafe_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_cafe -d cafe_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin123
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:
  redis_data: