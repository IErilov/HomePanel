services:
  app:
    build: .
    container_name: app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user_cafe:password_cafe@db:5432/cafe_database
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: admin123
      MINIO_SECRET_KEY: admin123
      SECRET_KEY: kldlkasndanfi12in12in3ikndniash
      ADMIN_SECRET_KEY: super-secret-admin-key
      FIRST_ADMIN_NAME: admin
      FIRST_ADMIN_PASSWORD: admin123
      FIRST_ADMIN_EMAIL: admin@example.com
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: user_cafe
      POSTGRES_PASSWORD: password_cafe
      POSTGRES_DB: cafe_database
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_cafe -d cafe_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin123
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server --console-address ":9001" /data

volumes:
  postgres_data:
  minio_data: