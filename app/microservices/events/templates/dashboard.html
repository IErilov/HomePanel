
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Service</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <h2>Event<span>Service</span></h2>

        <nav>
            <a class="active" href="#overview">Overview</a>
            <a href="#events">Event Logs</a>
            <a href="#traffic">Traffic</a>
        </nav>

        <div class="sidebar-footer">
            Monitoring System
            <small>Event Service v1.0</small>
        </div>
    </aside>

    <main>
        <header>
            <div>
                <h1>Dashboard</h1>
                <p>System activity and event monitoring</p>
            </div>
            <div class="status">
                <span></span> Service Online
            </div>
        </header>

        <section id="overview">
            <h2>Overview</h2>

            <div class="cards">
                <article class="card">
                    <p>Total Events</p>
                    <h2 id="total-events">—</h2>
                </article>

                <article class="card">
                    <p>Uploads</p>
                    <h2 id="uploads">—</h2>
                </article>

                <article class="card">
                    <p>Downloads</p>
                    <h2 id="downloads">—</h2>
                </article>

                <article class="card">
                    <p>Failed Events</p>
                    <h2 id="failed">—</h2>
                </article>
            </div>
        </section>

        <section id="traffic">
            <h2>Traffic</h2>
            <div class="chart-container">
                <canvas id="traffic-chart"></canvas>
            </div>
        </section>

        <section id="events">
            <h2>Recent Events</h2>

            <div class="filters">
                <select id="event-type">
                    <option value="">All events</option>
                    <option value="UPLOAD">Upload</option>
                    <option value="DOWNLOAD">Download</option>
                    <option value="DELETE">Delete</option>
                </select>

                <select id="event-status">
                    <option value="">All statuses</option>
                    <option value="SUCCESS">Success</option>
                    <option value="FAILED">Failed</option>
                    <option value="DENIED">Denied</option>
                </select>

                <button onclick="loadEvents()">Filter</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Event ID</th>
                            <th>Type</th>
                            <th>User</th>
                            <th>Bucket</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="events-table">
                        <tr>
                            <td colspan="6">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="/static/js/dashboard.js"></script>
</body>
</html>
