
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Service — Dashboard</title>

    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>

<body>
<div class="layout">

    <aside class="sidebar">
        <h2>Event<span>Service</span></h2>

        <nav>
            <a class="active" href="#overview">Overview</a>
            <a href="#events">Event Logs</a>
        </nav>

        <div class="sidebar-footer">
            Monitoring System
            <small>Event Service v1.0</small>
        </div>
    </aside>

    <main>

        <header>
            <div>
                <h1>Dashboard</h1>
                <p>System activity and event monitoring</p>
            </div>

            <div class="status">
                <span></span>
                Service Online
            </div>
        </header>

        <!-- Overview -->
        <section id="overview">
            <h2>Overview</h2>

            <div class="cards">

                <article class="card">
                    <p>Total Events</p>
                    <h2 id="total-events">—</h2>
                </article>

                <article class="card">
                    <p>Uploads</p>
                    <h2 id="uploads">—</h2>
                </article>

                <article class="card">
                    <p>Downloads</p>
                    <h2 id="downloads">—</h2>
                </article>

                <article class="card">
                    <p>Failed Events</p>
                    <h2 id="failed">—</h2>
                </article>

            </div>
        </section>

        <!-- Event Logs -->
        <section id="events">

            <h2>Recent Events</h2>

            <div class="filters">

                <select id="event-type">
                    <option value="">All events</option>
                    <option value="upload">Upload</option>
                    <option value="download">Download</option>
                    <option value="delete">Delete</option>
                    <option value="rename">Rename</option>
                </select>

                <select id="event-status">
                    <option value="">All statuses</option>
                    <option value="success">Success</option>
                    <option value="failed">Failed</option>
                    <option value="denied">Denied</option>
                </select>

                <button type="button" onclick="loadEvents()">
                    Apply filters
                </button>

            </div>

            <div class="table-container">

                <table>
                    <thead>
                        <tr>
                            <th>Event ID</th>
                            <th>Type</th>
                            <th>User</th>
                            <th>Bucket</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="events-table">
                        <tr>
                            <td colspan="6">Loading events...</td>
                        </tr>
                    </tbody>
                </table>

            </div>

        </section>

    </main>
</div>

<script src="/static/js/dashboard.js"></script>

</body>
</html>
